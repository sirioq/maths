<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday Maths Challenge 🌟 — Remix</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Quicksand', sans-serif;
  background: #FFFDF7;
  color: #2D2A3E;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, #FFD93D33 2px, transparent 2px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}
.page { position: relative; z-index: 1; }

/* HEADER */
.header {
  background: linear-gradient(135deg, #FF6B6B 0%, #FFB347 40%, #FFD93D 100%);
  padding: 40px 20px 60px;
  text-align: center;
  clip-path: ellipse(120% 100% at 50% 0%);
}
.header-emoji { font-size: 56px; display: block; animation: bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-10px) rotate(3deg);} }
.header h1 {
  font-family: 'Baloo 2', cursive;
  font-size: clamp(28px,7vw,48px);
  font-weight: 800; color: #fff;
  text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
  margin: 8px 0 6px;
}
.header p { color: rgba(255,255,255,0.92); font-size: 16px; font-weight: 600; }

/* HOME */
#home { max-width: 680px; margin: 0 auto; padding: 32px 20px 60px; }
.day-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 14px; margin-top: 28px; }
.day-card {
  border-radius: 20px; padding: 22px 14px; text-align: center;
  cursor: pointer; border: 3px solid transparent;
  transition: transform 0.18s, box-shadow 0.18s; position: relative; overflow: hidden;
}
.day-card::before { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.25); border-radius:18px; opacity:0; transition:opacity 0.2s; }
.day-card:hover::before { opacity:1; }
.day-card:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 12px 30px rgba(0,0,0,0.13); }
.day-card:active { transform:translateY(0) scale(0.98); }
.day-card.locked { background:#efefef !important; cursor:not-allowed; opacity:0.55; }
.day-card.locked:hover { transform:none; box-shadow:none; }
.card-emoji { font-size:36px; display:block; margin-bottom:8px; }
.card-title { font-family:'Baloo 2',cursive; font-size:17px; font-weight:800; color:#fff; }
.card-status { font-size:12px; font-weight:700; margin-top:4px; color:rgba(255,255,255,0.85); }
.day-card.locked .card-title, .day-card.locked .card-status { color:#aaa; }

/* WORKSHEET */
#worksheet { display:none; max-width:640px; margin:0 auto; padding:24px 20px 60px; }
.back-btn {
  background:none; border:3px solid currentColor; border-radius:30px; padding:8px 20px;
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:background 0.15s; margin-bottom:20px;
}
.back-btn:hover { background:currentColor; }
.back-btn:hover span { color:#fff; }
.day-hero {
  border-radius:24px; padding:28px 24px; margin-bottom:28px; color:#fff;
  position:relative; overflow:hidden;
}
.day-hero::after { content:attr(data-emoji); position:absolute; right:20px; top:50%; transform:translateY(-50%); font-size:64px; opacity:0.25; }
.day-hero h2 { font-family:'Baloo 2',cursive; font-size:32px; font-weight:800; text-shadow:2px 2px 0 rgba(0,0,0,0.1); }
.day-hero p { font-weight:600; opacity:0.9; margin-top:4px; font-size:15px; }

/* PROGRESS */
.progress-strip { display:flex; gap:8px; justify-content:center; margin-bottom:24px; }
.progress-dot { width:14px; height:14px; border-radius:50%; background:#e0e0e0; transition:background 0.3s,transform 0.3s; }
.progress-dot.done { transform:scale(1.2); }

/* QUESTION CARD */
.q-card {
  background:#fff; border-radius:20px; padding:22px 22px 18px; margin-bottom:18px;
  border:2.5px solid #eee; box-shadow:0 3px 16px rgba(0,0,0,0.05);
  transition:border-color 0.3s,box-shadow 0.3s; animation:slideIn 0.35s ease both;
}
@keyframes slideIn { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
.q-card:nth-child(1){animation-delay:0.05s;} .q-card:nth-child(2){animation-delay:0.1s;}
.q-card:nth-child(3){animation-delay:0.15s;} .q-card:nth-child(4){animation-delay:0.2s;}
.q-card:nth-child(5){animation-delay:0.25s;} .q-card:nth-child(6){animation-delay:0.3s;}
.q-card.correct { border-color:#6BCB77; box-shadow:0 3px 20px rgba(107,203,119,0.2); }
.q-card.wrong   { border-color:#FF6B6B; box-shadow:0 3px 20px rgba(255,107,107,0.15); }
.q-number {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:30px; height:30px; padding:0 8px;
  border-radius:15px; font-family:'Baloo 2',cursive; font-weight:800; font-size:15px;
  color:#fff; margin-bottom:10px;
}
.q-text { font-family:'Baloo 2',cursive; font-size:19px; font-weight:700; color:#2D2A3E; margin-bottom:6px; }
.q-prompt { font-size:14px; color:#777; font-weight:600; margin-bottom:14px; }

/* INPUTS */
.input-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.math-label { font-family:'Baloo 2',cursive; font-size:20px; font-weight:700; color:#444; }
.ans-input {
  width:72px; height:48px; border-radius:12px; border:3px solid #ddd;
  text-align:center; font-family:'Baloo 2',cursive; font-size:22px; font-weight:800;
  color:#2D2A3E; background:#fafafa; outline:none;
  transition:border-color 0.2s,background 0.2s,transform 0.15s;
  -moz-appearance:textfield;
}
.ans-input::-webkit-inner-spin-button { -webkit-appearance:none; }
.ans-input:focus { border-color:#4D96FF; background:#fff; transform:scale(1.04); }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.ans-input.shake { animation:shake 0.4s ease; }

/* SEQUENCE */
.seq-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.seq-fixed {
  width:54px; height:48px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:12px; background:#f0f0f0; border:3px solid #e0e0e0;
  font-family:'Baloo 2',cursive; font-size:18px; font-weight:800; color:#555;
}
.seq-input {
  width:54px; height:48px; border-radius:12px; border:3px solid #ddd;
  text-align:center; font-family:'Baloo 2',cursive; font-size:18px; font-weight:800;
  color:#2D2A3E; background:#fafafa; outline:none; transition:border-color 0.2s;
  -moz-appearance:textfield;
}
.seq-input::-webkit-inner-spin-button { -webkit-appearance:none; }
.seq-input:focus { border-color:#4D96FF; background:#fff; }
.seq-comma { font-size:18px; font-weight:700; color:#aaa; }

/* WORD INPUT */
.word-input {
  height:48px; width:220px; border-radius:12px; border:3px solid #ddd;
  padding:0 14px; font-family:'Quicksand',sans-serif; font-size:17px; font-weight:700;
  color:#2D2A3E; background:#fafafa; outline:none; transition:border-color 0.2s;
  margin-bottom:14px; display:block;
}
.word-input:focus { border-color:#4D96FF; background:#fff; }

/* CLOCK */
.clock-wrap { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin:12px 0 14px; }
.clock-svg { width:120px; height:120px; flex-shrink:0; filter:drop-shadow(0 3px 8px rgba(0,0,0,0.12)); }
.clock-input-col { display:flex; flex-direction:column; gap:6px; }

/* RULER */
.ruler-wrap { margin:14px 0 16px; }
.ruler-svg { display:block; width:100%; max-width:380px; }

/* SHAPES */
.shapes-row { display:flex; gap:18px; flex-wrap:wrap; margin:12px 0 14px; align-items:flex-start; }
.shape-item { display:flex; flex-direction:column; align-items:center; gap:8px; }
.shape-svg { width:80px; height:80px; }
.shape-input {
  width:100px; height:40px; border-radius:10px; border:3px solid #ddd;
  text-align:center; font-family:'Quicksand',sans-serif; font-size:14px; font-weight:700;
  color:#2D2A3E; background:#fafafa; outline:none; transition:border-color 0.2s;
}
.shape-input:focus { border-color:#4D96FF; background:#fff; }
.shape-input.ok  { border-color:#6BCB77; background:#e8fef0; color:#1a7a38; }
.shape-input.bad { border-color:#FF6B6B; background:#fff3f0; }

/* SCALES */
.scales-wrap { margin:12px 0 16px; }
.scales-svg { display:block; width:100%; max-width:260px; }

/* NUMBER LINE */
.nline-wrap { margin:12px 0 16px; }
.nline-svg { display:block; width:100%; max-width:420px; }

/* FRACTIONS */
.fractions-wrap { display:flex; gap:20px; flex-wrap:wrap; margin:12px 0 14px; align-items:flex-start; }
.fraction-item { display:flex; flex-direction:column; align-items:center; gap:6px; }
.fraction-label { font-size:12px; font-weight:700; color:#aaa; }
.frac-section { cursor:pointer; transition:fill 0.15s; }
.frac-section:hover { opacity:0.8; }
.frac-section.shaded { fill:#E74C3C !important; }
.frac-section.correct-shade { fill:#6BCB77 !important; cursor:default; }
.frac-section.wrong-shade  { fill:#FF6B6B !important; cursor:default; }
.frac-section.locked { cursor:default; }
.picto-table { width:100%; border-collapse:collapse; margin:10px 0 14px; }
.picto-table td { padding:4px 6px; vertical-align:middle; }
.picto-label { font-weight:700; font-size:13px; color:#555; white-space:nowrap; width:90px; }
.picto-squares { display:flex; gap:3px; flex-wrap:wrap; }
.picto-sq { width:20px; height:20px; border-radius:4px; background:#E91E8C; border:2px solid #c0156f; flex-shrink:0; }
.picto-count { font-size:12px; font-weight:700; color:#aaa; margin-left:4px; }
.picto-parts { display:flex; flex-direction:column; gap:12px; margin-top:4px; }
.picto-part { background:#fdf0f8; border-radius:12px; padding:10px 14px; border:2px solid #f5c6e8; }
.picto-part-label { font-size:13px; font-weight:700; color:#555; margin-bottom:8px; }

/* EVEN NUMBERS */
.even-grid { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 14px; }
.num-btn {
  width:56px; height:56px; border-radius:14px; border:3px solid #ddd;
  font-family:'Baloo 2',cursive; font-size:22px; font-weight:800; color:#555;
  background:#f9f9f9; cursor:pointer; transition:all 0.15s; display:flex;
  align-items:center; justify-content:center;
}
.num-btn:hover { border-color:#E91E8C; color:#E91E8C; transform:scale(1.05); }
.num-btn.selected { background:#E91E8C; border-color:#c0156f; color:#fff; transform:scale(1.08); }
.num-btn.locked { cursor:default; }
.num-btn.locked.selected { background:#6BCB77; border-color:#4aab55; }
.num-btn.locked.wrong-sel { background:#FF6B6B; border-color:#e53535; color:#fff; }
.num-btn.locked.missed { border-color:#6BCB77; color:#6BCB77; background:#e8fef0; }

/* DIGIT CARDS */
.digit-cards-row { display:flex; gap:10px; margin:12px 0 10px; flex-wrap:wrap; }
.digit-card-tile {
  width:52px; height:68px; border-radius:10px; background:linear-gradient(135deg,#E91E8C,#C77DFF);
  display:flex; align-items:center; justify-content:center;
  font-family:'Baloo 2',cursive; font-size:30px; font-weight:800; color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,0.15); user-select:none;
}
.digit-parts { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
.digit-part { background:#fdf0f8; border-radius:12px; padding:10px 14px; border:2px solid #f5c6e8; }
.digit-part-label { font-size:13px; font-weight:700; color:#555; margin-bottom:8px; }
.digit-emphasis { font-weight:900; text-decoration:underline; color:#E91E8C; }

/* CLASS COMBO / GENERIC TWO-PART */
.two-part-box { background:#f0fdf6; border-radius:12px; padding:10px 14px; border:2px solid #b6f0d4; margin-bottom:10px; }
.two-part-label { font-size:13px; font-weight:700; color:#1a7a38; margin-bottom:8px; }

/* ARRAY */
.array-wrap { margin:10px 0 14px; overflow-x:auto; }
.array-grid { display:inline-grid; gap:4px; }
.array-dot { width:18px; height:18px; border-radius:50%; background:#2ECC71; border:2px solid #1aab55; flex-shrink:0; }

/* FACT FAMILY */
.fact-family-wrap { margin:10px 0 14px; }
.fact-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; padding:10px 14px; background:#f0fdf6; border-radius:12px; border:2px solid #b6f0d4; }
.fact-label { font-family:'Baloo 2',cursive; font-size:17px; font-weight:700; color:#1a7a38; }
.fact-input { width:60px; height:42px; border-radius:10px; border:3px solid #ddd; text-align:center; font-family:'Baloo 2',cursive; font-size:18px; font-weight:800; color:#2D2A3E; background:#fafafa; outline:none; transition:border-color 0.2s; -moz-appearance:textfield; }
.fact-input::-webkit-inner-spin-button { -webkit-appearance:none; }
.fact-input:focus { border-color:#2ECC71; background:#fff; }
.fact-input.ok  { border-color:#6BCB77; background:#e8fef0; }
.fact-input.bad { border-color:#FF6B6B; background:#fff3f0; }
.thermo-wrap { display:flex; align-items:flex-start; gap:20px; margin:12px 0 16px; flex-wrap:wrap; }
.thermo-svg { width:80px; cursor:pointer; flex-shrink:0; user-select:none; }
.thermo-info { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
.thermo-reading { font-family:'Baloo 2',cursive; font-size:28px; font-weight:800; color:#E74C3C; min-height:36px; }
.thermo-label { font-size:13px; font-weight:700; color:#888; line-height:1.5; }

/* BUTTONS */
.btn-check {
  border:none; border-radius:30px; padding:10px 24px;
  font-family:'Baloo 2',cursive; font-size:15px; font-weight:700; color:#fff;
  cursor:pointer; transition:transform 0.12s,box-shadow 0.12s;
  box-shadow:0 4px 0 rgba(0,0,0,0.15); margin-right:8px;
}
.btn-check:hover { transform:translateY(-2px); box-shadow:0 6px 0 rgba(0,0,0,0.15); }
.btn-check:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }
.btn-try {
  border:3px solid #ddd; border-radius:30px; padding:8px 18px;
  font-family:'Quicksand',sans-serif; font-size:13px; font-weight:700;
  color:#999; background:transparent; cursor:pointer; transition:border-color 0.2s,color 0.2s;
}
.btn-try:hover { border-color:#bbb; color:#666; }

/* FEEDBACK */
.feedback {
  margin-top:10px; padding:10px 16px; border-radius:12px;
  font-weight:700; font-size:15px; display:none; animation:pop 0.3s ease;
}
@keyframes pop { 0%{transform:scale(0.85);opacity:0;} 70%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
.feedback.show { display:block; }
.feedback.ok-fb  { background:#e8fef0; color:#1a7a38; border:2px solid #b6f0c8; }
.feedback.bad-fb { background:#fff3f0; color:#c0392b; border:2px solid #ffd6d0; }

/* HINT */
.hint-btn {
  background:none; border:none; font-size:13px; font-weight:700;
  color:#bbb; cursor:pointer; font-family:'Quicksand',sans-serif;
  padding:4px 0; text-decoration:underline; text-underline-offset:3px;
  display:block; margin-top:4px;
}
.hint-btn:hover { color:#888; }
.hint-box {
  margin-top:8px; padding:9px 14px; background:#fffbe6;
  border:2px dashed #FFD93D; border-radius:10px;
  font-size:13px; font-weight:700; color:#7a5f00; display:none;
}
.hint-box.show { display:block; animation:pop 0.25s ease; }

/* DONE BANNER */
.done-banner {
  background:linear-gradient(135deg,#6BCB77,#4D96FF);
  border-radius:24px; padding:32px 24px; text-align:center; color:#fff;
  display:none; animation:pop 0.5s ease; margin-top:8px;
}
.done-banner.show { display:block; }
.done-banner .big-emoji { font-size:52px; }
.done-banner h3 { font-family:'Baloo 2',cursive; font-size:28px; font-weight:800; margin:8px 0 4px; }
.done-banner p { font-size:16px; font-weight:600; opacity:0.92; }
.stars { font-size:28px; letter-spacing:4px; margin-top:10px; }

/* CONFETTI */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:999; display:none; }
.confetti-wrap.active { display:block; }
.confetti-dot { position:absolute; border-radius:3px; animation:fall 1.2s ease-out forwards; }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1;} 100%{transform:translateY(100vh) rotate(720deg);opacity:0;} }

@media(max-width:480px){ .day-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="page">
<div class="confetti-wrap" id="confetti"></div>

<!-- HOME -->
<div id="home">
  <div class="header">
    <span class="header-emoji">🧮</span>
    <h1>Holiday Maths! Remix 🔀</h1>
    <p>7 days of fun challenges — pick a day to start! 🎈</p>
  </div>
  <div class="day-grid" id="dayGrid"></div>
</div>

<!-- WORKSHEET -->
<div id="worksheet">
  <button class="back-btn" id="backBtn" onclick="goHome()">
    <span>←</span><span>All Days</span>
  </button>
  <div class="day-hero" id="dayHero"></div>
  <div class="progress-strip" id="progressStrip"></div>
  <div id="questionsContainer"></div>
  <div class="done-banner" id="doneBanner">
    <div class="big-emoji" id="doneBannerEmoji">🏅</div>
    <h3 id="doneBannerTitle">Amazing work!</h3>
    <p id="doneSummary"></p>
    <div class="stars" id="doneStars"></div>
    <button onclick="goHome()" style="margin-top:18px;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.6);border-radius:30px;padding:10px 28px;color:#fff;font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;cursor:pointer;">
      ← Back to all days
    </button>
  </div>
</div>
</div>

<script>
// ===================== DATA =====================
const DAYS = [
  {
    day:1, emoji:"🌞", color:"#FF6B35", gradient:"linear-gradient(135deg,#FF6B35,#FFB347)",
    questions:[
      { type:"fill", text:"11 + __ = 20", prompt:"What number fills the gap?",
        prefix:"11 + ", suffix:" = 20", answer:9,
        hint:"Start at 11 and count up to 20 — how many steps?" },
      { type:"sequence", text:"Fill in the missing numbers", prompt:"Complete the number sequence:",
        sequence:[null,61,62,63,null,null], answers:[60,64,65],
        hint:"Count up by 1 each time — what comes before 61? What comes after 63?" },
      { type:"fill", text:"Orange problem 🍊", prompt:"Oranges cost 3p each. Sam spent 12p. How many oranges did he buy?",
        prefix:"", suffix:" oranges", answer:4,
        hint:"How many 3p coins make 12p? Try counting in 3s!" },
      { type:"fill", text:"45 − 10 = __", prompt:"What is 45 minus 10?",
        prefix:"45 − 10 = ", suffix:"", answer:35,
        hint:"When you take away 10, the tens digit goes down by 1." },
      { type:"fill", text:"½ of 14 = __", prompt:"Find half of 14:",
        prefix:"½ of 14 = ", suffix:"", answer:7,
        hint:"Split 14 into 2 equal groups. How many in each?" }
    ]
  },
  {
    day:2, emoji:"🌈", color:"#7B61FF", gradient:"linear-gradient(135deg,#7B61FF,#C77DFF)",
    questions:[
      { type:"fill", text:"20 ÷ 4 = __", prompt:"What is 20 divided by 4?",
        prefix:"20 ÷ 4 = ", suffix:"", answer:5,
        hint:"How many 4s fit into 20? Count up in 4s!" },
      { type:"ruler", text:"Measure the line 📏", prompt:"How long is this line? Type your answer in cm.",
        answer:7, hint:"Line up the ruler from 0. Count each centimetre mark." },
      { type:"shapes", text:"Name these 2D shapes 🔷", prompt:"Type the name of each shape:",
        shapes:[
          { id:"triangle", acceptedAnswers:["triangle","triangles"] },
          { id:"circle",   acceptedAnswers:["circle","circles"] },
          { id:"rectangle",acceptedAnswers:["rectangle","rectangles","oblong"] }
        ],
        hint:"Count the sides! Triangle = 3, Circle = 0, Rectangle = 4." },
      { type:"fill", text:"3 × 4 = __", prompt:"What is 3 times 4?",
        prefix:"3 × 4 = ", suffix:"", answer:12,
        hint:"Add 3 four times, or add 4 three times!" },
      { type:"fill", text:"60 + __ = 67", prompt:"What number fills the gap?",
        prefix:"60 + ", suffix:" = 67", answer:7,
        hint:"What do you add to 60 to reach 67?" }
    ]
  },
  {
    day:3, emoji:"🐝", color:"#F5A623", gradient:"linear-gradient(135deg,#F5A623,#FFD93D)",
    questions:[
      { type:"clock-combo", text:"Telling the time 🕒",
        clockHour:3, clockMinute:0,
        partA:{ prompt:"Q1a — What time is shown on the clock?", answer:3,
                hint:"The short hand points to the hour. Long hand on 12 = o'clock." },
        partB:{ prompt:"Q1b — At half past three, what number does the minute hand point to?", answer:6,
                hint:"Half past = 30 minutes. The minute hand travels halfway round — where does it land?" } },
      { type:"word", text:"Write as a word ✏️", prompt:"Write the number 13 as a word:",
        acceptedAnswers:["thirteen"],
        hint:"Say it out loud — thir... teen. Two parts to spell!" },
      { type:"fill", text:"🍊 Orange and 🍋 Lemon",
        prompt:"A lemon weighs half as much as an orange. The orange weighs 20g. How much does the lemon weigh?",

const CORRECT = ["🎉 Yes! Brilliant work!","⭐ Superstar! Spot on!","🌟 Amazing! You got it!","🎊 Fantastic! That's right!","✨ Excellent! Well done!","🥳 You're on fire! Correct!","💫 Wow! Perfect answer!","🙌 Incredible! Nailed it!"];

const rand = arr => arr[Math.floor(Math.random()*arr.length)];

let currentDay = null;
let scores = {};
let completedDays = new Set();

// ===================== HOME =====================
function buildHome() {
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  DAYS.forEach((d,i) => {
    const done = completedDays.has(i);
    const card = document.createElement('div');
    card.className = 'day-card' + (d.locked?' locked':'');
    card.style.background = d.locked ? '' : d.gradient;
    if (done) card.style.outline = '4px solid #fff';
    if (!d.locked) card.onclick = () => openDay(i);
    card.innerHTML = `
      <span class="card-emoji">${d.locked ? '🔒' : done ? '✅' : d.emoji}</span>
      <div class="card-title">Day ${d.day}</div>
      <div class="card-status">${d.locked ? 'Coming soon' : done ? 'Completed! 🌟' : 'Ready!'}</div>`;
    grid.appendChild(card);
  });
}

function goHome() {
  document.getElementById('worksheet').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  buildHome();
}

// ===================== OPEN DAY =====================
function openDay(idx) {
  currentDay = idx;
  scores = {};
  const day = DAYS[idx];
  document.getElementById('home').style.display = 'none';
  const ws = document.getElementById('worksheet');
  ws.style.display = 'block';
  document.getElementById('backBtn').style.color = day.color;
  const hero = document.getElementById('dayHero');
  hero.style.background = day.gradient;
  hero.setAttribute('data-emoji', day.emoji);
  hero.innerHTML = `<h2>${day.emoji} Day ${day.day} Maths</h2><p>${day.questions.length} questions · Take your time!</p>`;
  buildProgress(day);
  buildQuestions(day);
  document.getElementById('doneBanner').classList.remove('show');
  ws.scrollIntoView({behavior:'smooth'});
}

// ===================== PROGRESS =====================
function buildProgress(day) {
  const strip = document.getElementById('progressStrip');
  strip.innerHTML = '';
  day.questions.forEach((_,i) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.id = 'pdot-'+i;
    strip.appendChild(dot);
  });
}

function updateProgress(day) {
  day.questions.forEach((_,i) => {
    const dot = document.getElementById('pdot-'+i);
    if (!dot) return;
    if (scores[i] === true)  { dot.style.background='#6BCB77'; dot.classList.add('done'); }
    else if (scores[i]===false) { dot.style.background='#FFB347'; dot.classList.add('done'); }
  });
}

// ===================== BUILD QUESTIONS =====================
const COLORS = ['#FF6B6B','#4D96FF','#6BCB77','#FFB347','#C77DFF'];

function buildQuestions(day) {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  day.questions.forEach((q,i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-'+i;
    card.style.animationDelay = (i*0.07)+'s';
    card.innerHTML = makeCardHTML(q, i, day);
    container.appendChild(card);
    // bind enter key
    card.querySelectorAll('input[type=number],input[type=text]').forEach(inp => {
      inp.addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(i); });
    });
  });
}

function makeCardHTML(q, i, day) {
  const col = COLORS[i % COLORS.length];
  const badge = q.subLabel
    ? `<div class="q-number" style="background:${col}">${q.subLabel}</div>`
    : `<div class="q-number" style="background:${col}">${i+1}</div>`;
  const twoPartTypes = ['clock-combo','pictogram-combo','digit-cards-combo','class-combo'];
  const multiPart = [...twoPartTypes,'fact-family'];
  const promptHTML = (!multiPart.includes(q.type) && q.prompt)
    ? `<div class="q-prompt">${q.prompt}</div>` : '';
  const hintText = twoPartTypes.includes(q.type)
    ? q.partA.hint + ' | ' + q.partB.hint
    : (q.hint||'');
  return `
    ${badge}
    <div class="q-text">${q.text}</div>
    ${promptHTML}
    ${makeInputHTML(q, i)}
    <div style="margin-top:4px;">
      <button class="btn-check" id="checkBtn-${i}" style="background:${day.color}" onclick="checkAnswer(${i})">Check ✓</button>
      <button class="btn-try" id="tryBtn-${i}" style="display:none" onclick="tryAgain(${i})">Try again 🔄</button>
    </div>
    <div class="feedback" id="fb-${i}"></div>
    <button class="hint-btn" id="hintBtn-${i}" onclick="toggleHint(${i})">💬 Show hint</button>
    <div class="hint-box" id="hint-${i}">💡 ${hintText}</div>`;
}

function makeInputHTML(q, i) {
  if (q.type === 'fill') {
    return `<div class="input-row">
      ${q.prefix ? `<span class="math-label">${q.prefix}</span>` : ''}
      <input class="ans-input" type="number" id="ans-${i}" placeholder="?" autocomplete="off">
      ${q.suffix ? `<span class="math-label">${q.suffix}</span>` : ''}
    </div>`;
  }
  if (q.type === 'sequence') {
    let html = '<div class="seq-row">';
    let bi = 0;
    q.sequence.forEach((v,si) => {
      if (si>0) html += '<span class="seq-comma">,</span>';
      if (v===null) {
        html += `<input class="seq-input" type="number" id="seq-${i}-${bi++}" placeholder="?" autocomplete="off">`;
      } else {
        html += `<div class="seq-fixed">${v}</div>`;
      }
    });
    return html + '</div>';
  }
  if (q.type === 'word') {
    return `<input class="word-input" type="text" id="ans-${i}" placeholder="Type the word..." autocomplete="off" spellcheck="false">`;
  }
  if (q.type === 'clock-combo') {
    return makeClockHTML(q, i);
  }
  if (q.type === 'ruler') {
    return makeRulerHTML(q, i);
  }
  if (q.type === 'shapes') {
    return makeShapesHTML(q, i);
  }
  if (q.type === 'scales') {
    return makeScalesHTML(q, i);
  }
  if (q.type === 'thermometer') {
    return makeThermoHTML(q, i);
  }
  if (q.type === 'pictogram-combo') {
    return makePictogramHTML(q, i);
  }
  if (q.type === 'even-numbers') {
    return makeEvenHTML(q, i);
  }
  if (q.type === 'digit-cards-combo') {
    return makeDigitCardsHTML(q, i);
  }
  if (q.type === 'class-combo') {
    return makeClassComboHTML(q, i);
  }
  if (q.type === 'fact-family') {
    return makeFactFamilyHTML(q, i);
  }
  if (q.type === 'numberline') {
    return makeNumberLineHTML(q, i);
  }
  if (q.type === 'fractions') {
    return makeFractionsHTML(q, i);
  }
  return '';
}

// --- Clock ---
function makeClockHTML(q, i) {
  const cx=60, cy=60;
  const hAngle = ((q.clockHour%12)/12)*2*Math.PI - Math.PI/2 + (q.clockMinute/60)*(2*Math.PI/12);
  const mAngle = (q.clockMinute/60)*2*Math.PI - Math.PI/2;
  const hx=(cx+Math.cos(hAngle)*28).toFixed(1), hy=(cy+Math.sin(hAngle)*28).toFixed(1);
  const mx=(cx+Math.cos(mAngle)*42).toFixed(1), my=(cy+Math.sin(mAngle)*42).toFixed(1);
  let nums='', ticks='';
  for(let n=1;n<=12;n++){
    const a=(n/12)*2*Math.PI-Math.PI/2;
    nums+=`<text x="${(cx+Math.cos(a)*38).toFixed(1)}" y="${(cy+Math.sin(a)*38+4).toFixed(1)}" text-anchor="middle" font-size="10" font-family="Baloo 2,cursive" font-weight="700" fill="#444">${n}</text>`;
  }
  for(let t=0;t<60;t++){
    const a=(t/60)*2*Math.PI-Math.PI/2;
    const big=t%5===0, r1=big?46:49;
    ticks+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*52).toFixed(1)}" y2="${(cy+Math.sin(a)*52).toFixed(1)}" stroke="${big?'#bbb':'#ddd'}" stroke-width="${big?1.5:0.8}"/>`;
  }
  return `<div class="clock-wrap">
    <svg class="clock-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="56" fill="#fff" stroke="#e0e0e0" stroke-width="2.5"/>
      <circle cx="${cx}" cy="${cy}" r="56" fill="none" stroke="#F5A623" stroke-width="2"/>
      ${ticks}${nums}
      <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#2D2A3E" stroke-width="5" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="#2D2A3E"/>
    </svg>
    <div class="clock-input-col">
      <div style="font-size:13px;font-weight:700;color:#555;margin-bottom:4px;">${q.partA.prompt}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <input class="ans-input" type="number" id="clock-a-${i}" placeholder="?" autocomplete="off" style="width:64px;">
        <span class="math-label" style="font-size:16px;">o'clock</span>
      </div>
      <div style="font-size:13px;font-weight:700;color:#555;margin-bottom:4px;">${q.partB.prompt}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:13px;color:#888;font-weight:600;">Minute hand points to</span>
        <input class="ans-input" type="number" id="clock-b-${i}" placeholder="?" autocomplete="off" style="width:64px;">
      </div>
    </div>
  </div>`;
}

// --- Ruler ---
function makeRulerHTML(q, i) {
  const lineEndX = 10 + q.answer * 32;
  let ticks = '';
  for (let t=0; t<=10; t++) {
    const x = 10 + t*32;
    const big = t%5===0;
    const tickH = big ? 16 : 10;
    ticks += `<line x1="${x}" y1="22" x2="${x}" y2="${22+tickH}" stroke="#888" stroke-width="${big?2:1.2}"/>`;
    ticks += `<text x="${x}" y="${22+tickH+11}" text-anchor="middle" font-size="9" font-family="Quicksand,sans-serif" font-weight="700" fill="#666">${t}</text>`;
  }
  return `<div class="ruler-wrap">
    <svg class="ruler-svg" viewBox="0 0 380 80" xmlns="http://www.w3.org/2000/svg">
      <line x1="10" y1="10" x2="${lineEndX}" y2="10" stroke="#7B61FF" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="4" x2="10" y2="16" stroke="#7B61FF" stroke-width="3" stroke-linecap="round"/>
      <line x1="${lineEndX}" y1="4" x2="${lineEndX}" y2="16" stroke="#7B61FF" stroke-width="3" stroke-linecap="round"/>
      <rect x="10" y="22" width="320" height="50" rx="4" fill="#FFF9E6" stroke="#C8A800" stroke-width="2"/>
      ${ticks}
      <text x="348" y="62" font-size="9" font-family="Quicksand,sans-serif" font-weight="700" fill="#aaa">cm</text>
    </svg>
    <div class="input-row">
      <input class="ans-input" type="number" id="ans-${i}" placeholder="?" autocomplete="off" style="width:72px">
      <span class="math-label">cm</span>
    </div>
  </div>`;
}

  });
  return html + '</div>';

function makeScalesHTML(q, i) {
  const minV=0, maxV=500, rangeD=270, startA=-135;
  const toRad = a => a*Math.PI/180;
  const cx=100, cy=88, outerR=78, innerR=66;
  let ticks='';
  for (let v=0; v<=maxV; v+=10) {
    const angle = startA + (v/maxV)*rangeD;
    const isMaj = v%50===0;
    const r1 = isMaj ? innerR-8 : innerR-2;
    const x1=(cx+Math.cos(toRad(angle))*r1).toFixed(1);
    const y1=(cy+Math.sin(toRad(angle))*r1).toFixed(1);
    const x2=(cx+Math.cos(toRad(angle))*outerR).toFixed(1);
    const y2=(cy+Math.sin(toRad(angle))*outerR).toFixed(1);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMaj?'#888':'#bbb'}" stroke-width="${isMaj?2:1}" stroke-linecap="round"/>`;
    if (isMaj) {
      const lx=(cx+Math.cos(toRad(angle))*(innerR-20)).toFixed(1);
      const ly=(cy+Math.sin(toRad(angle))*(innerR-20)+3.5).toFixed(1);
      ticks+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" font-family="Quicksand,sans-serif" font-weight="700" fill="#555">${v}</text>`;
    }
  }
  const needleA = startA + (q.scaleValue/maxV)*rangeD;
  const nx=(cx+Math.cos(toRad(needleA))*(innerR-6)).toFixed(1);
  const ny=(cy+Math.sin(toRad(needleA))*(innerR-6)).toFixed(1);
  return `<div class="scales-wrap">
    <svg class="scales-svg" viewBox="0 0 200 165" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${outerR}" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#fff" stroke="#eee" stroke-width="1"/>
      ${ticks}
      <text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="10" font-family="Quicksand,sans-serif" font-weight="700" fill="#888">g</text>
      <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="#2D2A3E"/>
      <rect x="82" y="${cy+outerR+2}" width="36" height="9" rx="4" fill="#e0e0e0"/>
      <rect x="72" y="${cy+outerR+10}" width="56" height="7" rx="3" fill="#d0d0d0"/>
    </svg>
    <div class="input-row" style="margin-top:2px;">
      <input class="ans-input" type="number" id="ans-${i}" placeholder="?" autocomplete="off" style="width:80px;">
      <span class="math-label">g</span>
    </div>
  </div>`;
}

// --- Thermometer ---
function makeThermoHTML(q, i) {
  // tube: top y=22, bottom y=278, range=256px for 0-40°C
  let ticks='';
  for (let t=0; t<=40; t++) {
    const y=(278-(t/40)*256).toFixed(1);
    const isMaj=t%5===0;
    const x1=isMaj?18:24;
    ticks+=`<line x1="${x1}" y1="${y}" x2="32" y2="${y}" stroke="#aaa" stroke-width="${isMaj?1.5:0.8}"/>`;

// ===================== THERMOMETER CLICK =====================
function thermoClick(event, qi, minT, maxT) {
  const svg = document.getElementById('thermosvg-'+qi);
  if (svg.style.pointerEvents === 'none') return;
  const rect = svg.getBoundingClientRect();
  const clickY = event.clientY - rect.top;
  const svgH = rect.height;
  const bottomY = (278/340)*svgH;
  const topY    = (22/340)*svgH;
  let frac = 1 - (clickY - topY) / (bottomY - topY);
  frac = Math.max(0, Math.min(1, frac));
  const temp = Math.round(minT + frac*(maxT-minT));
  // Update mercury
  const mercH = (temp/maxT)*256;
  const mercury = document.getElementById('mercury-'+qi);
  mercury.setAttribute('y', (278-mercH).toFixed(1));
  mercury.setAttribute('height', mercH.toFixed(1));
  // Update marker
  const marker = document.getElementById('tmarker-'+qi);
  const markerY = (278-mercH).toFixed(1);
  marker.setAttribute('y1', markerY); marker.setAttribute('y2', markerY);
  marker.setAttribute('display','block');
  // Update display
  document.getElementById('tread-'+qi).textContent = temp+'°C';
  document.getElementById('tval-'+qi).value = temp;
}

// ===================== CHECK =====================
function checkAnswer(i) {
  const day = DAYS[currentDay];
  const q = day.questions[i];
  const card = document.getElementById('qcard-'+i);
  const fb   = document.getElementById('fb-'+i);
  const checkBtn = document.getElementById('checkBtn-'+i);
  const tryBtn   = document.getElementById('tryBtn-'+i);

  let correct = false;

  if (q.type === 'sequence') {
    let all = true;
    q.answers.forEach((ans,bi) => {
      const v = parseInt(document.getElementById('seq-'+i+'-'+bi).value);
      if (v !== ans) all = false;
    });
    correct = all;
  } else if (q.type === 'shapes') {
    let all = true;
    q.shapes.forEach((s,si) => {
      const inp = document.getElementById('shape-'+i+'-'+si);
      const ok = s.acceptedAnswers.includes(inp.value.trim().toLowerCase());
      inp.classList.remove('ok','bad');
      inp.classList.add(ok?'ok':'bad');
      if (!ok) all = false;
    });
    correct = all;
  } else if (q.type === 'word') {
    const v = document.getElementById('ans-'+i).value.trim().toLowerCase();
    correct = q.acceptedAnswers.includes(v);
  } else if (q.type === 'clock-combo') {
    const va = parseInt(document.getElementById('clock-a-'+i).value);
    const vb = parseInt(document.getElementById('clock-b-'+i).value);
    const okA = va === q.partA.answer;
    const okB = vb === q.partB.answer;
    document.getElementById('clock-a-'+i).style.borderColor = okA ? '#6BCB77':'#FF6B6B';
    document.getElementById('clock-b-'+i).style.borderColor = okB ? '#6BCB77':'#FF6B6B';
    correct = okA && okB;
  } else if (q.type === 'thermometer') {
    document.getElementById('tread-'+i).style.visibility = 'visible';
    correct = parseInt(document.getElementById('tval-'+i).value) === q.targetTemp;
  } else if (q.type === 'pictogram-combo') {
    const va = parseInt(document.getElementById('picto-a-'+i).value);
    const vb = parseInt(document.getElementById('picto-b-'+i).value);
    const okA = va === q.partA.answer;
    const okB = vb === q.partB.answer;
    document.getElementById('picto-a-'+i).style.borderColor = okA ? '#6BCB77':'#FF6B6B';
    document.getElementById('picto-b-'+i).style.borderColor = okB ? '#6BCB77':'#FF6B6B';
    correct = okA && okB;
  } else if (q.type === 'even-numbers') {
    const selected = q.numbers.filter(n => {
      const btn = document.getElementById('numBtn-'+i+'-'+n);
      return btn && btn.classList.contains('selected');
    });
    const correctSet = JSON.stringify([...q.correctEvens].sort((a,b)=>a-b));
    const selectedSet = JSON.stringify([...selected].sort((a,b)=>a-b));
    correct = correctSet === selectedSet;
    // Colour buttons
    q.numbers.forEach(n => {
      const btn = document.getElementById('numBtn-'+i+'-'+n);
      if (!btn) return;
      const isEven = q.correctEvens.includes(n);
      const wasSelected = btn.classList.contains('selected');
      btn.classList.add('locked');
      if (isEven && wasSelected)  btn.classList.add('selected');
      else if (!isEven && wasSelected) btn.classList.add('wrong-sel');
      else if (isEven && !wasSelected) btn.classList.add('missed');
    });
  } else if (q.type === 'digit-cards-combo') {
    const va = parseInt(document.getElementById('digit-a-'+i).value);
    const vb = parseInt(document.getElementById('digit-b-'+i).value);
    const okA = va === q.partA.answer;
    const okB = vb === q.partB.answer;
    document.getElementById('digit-a-'+i).style.borderColor = okA ? '#6BCB77':'#FF6B6B';
    document.getElementById('digit-b-'+i).style.borderColor = okB ? '#6BCB77':'#FF6B6B';
    correct = okA && okB;
  } else if (q.type === 'class-combo') {
    const va = parseInt(document.getElementById('class-a-'+i).value);
    const vb = parseInt(document.getElementById('class-b-'+i).value);
    const okA = va === q.partA.answer;
    const okB = vb === q.partB.answer;
    document.getElementById('class-a-'+i).style.borderColor = okA ? '#6BCB77':'#FF6B6B';
    document.getElementById('class-b-'+i).style.borderColor = okB ? '#6BCB77':'#FF6B6B';
    correct = okA && okB;
  } else if (q.type === 'fact-family') {
    let allOk = true;

    // Separate anyOrder rows from normal rows
    const anyOrderIndices = q.facts.map((f,fi) => f.anyOrder ? fi : null).filter(x => x!==null);
    const validCombos = anyOrderIndices.length ? q.facts[anyOrderIndices[0]].validCombos : [];

    // Check normal (non-anyOrder) rows individually
    q.facts.forEach((f, fi) => {
      if (f.anyOrder) return;
      const blanks = f.fixed ? [2] : [0,1,2];
      blanks.forEach(bi => {
        const inp = document.getElementById(`fact-${i}-${fi}-${bi}`);
        const ok = parseInt(inp.value) === f.answers[bi];
        inp.classList.remove('ok','bad'); inp.classList.add(ok?'ok':'bad');
        if (!ok) allOk = false;
      });
    });

    // Check anyOrder rows: each must match a valid combo AND together all combos must be used
    const usedCombos = new Set();
    anyOrderIndices.forEach(fi => {
      const vals = [0,1,2].map(bi => parseInt(document.getElementById(`fact-${i}-${fi}-${bi}`).value));
      const matchIdx = validCombos.findIndex(c => c[0]===vals[0] && c[1]===vals[1] && c[2]===vals[2]);
      const rowOk = matchIdx !== -1;
      if (rowOk) usedCombos.add(matchIdx);
      [0,1,2].forEach(bi => {
        const inp = document.getElementById(`fact-${i}-${fi}-${bi}`);
        inp.classList.remove('ok','bad'); inp.classList.add(rowOk?'ok':'bad');
      });
      if (!rowOk) allOk = false;
    });
    // All combos must appear across the anyOrder rows
    if (usedCombos.size < validCombos.length) {
      allOk = false;
      // Re-mark anyOrder rows as wrong since together they don't cover all combos
      anyOrderIndices.forEach(fi => {
        [0,1,2].forEach(bi => {
          const inp = document.getElementById(`fact-${i}-${fi}-${bi}`);
          inp.classList.remove('ok'); inp.classList.add('bad');
        });
      });
    }
    correct = allOk;
  } else if (q.type === 'numberline') {
    correct = parseInt(document.getElementById('ans-'+i).value) === q.answer;
  } else if (q.type === 'fractions') {
    let allOk = true;
    q.shapes.forEach((s, si) => {
      const total = s.sections;
      const needed = s.half;
      const shadedEls = [];
      for (let k=0; k<total; k++) {
        const el = document.getElementById(`frac-${i}-${si}-${k}`);
        if (el && el.classList.contains('shaded')) shadedEls.push(el);
      }
      const shapeOk = shadedEls.length === needed;
      for (let k=0; k<total; k++) {
        const el = document.getElementById(`frac-${i}-${si}-${k}`);
        if (!el) continue;
        el.classList.add('locked');
        if (el.classList.contains('shaded')) {
          el.classList.remove('shaded');
          el.classList.add(shapeOk ? 'correct-shade' : 'wrong-shade');
        } else {
          el.style.fill = shapeOk ? '#e8fef0' : '#fff8f0';
        }
      }
      if (!shapeOk) allOk = false;
    });
    correct = allOk;
  } else {
    correct = parseInt(document.getElementById('ans-'+i).value) === q.answer;
  }

  if (scores[i] !== true) scores[i] = correct;

  card.classList.remove('correct','wrong');
  fb.classList.remove('show','ok-fb','bad-fb');
  void fb.offsetWidth;

  if (correct) {
    card.classList.add('correct');
    fb.textContent = rand(CORRECT);
    fb.classList.add('show','ok-fb');
    checkBtn.style.display = 'none';
    tryBtn.style.display   = 'none';
    // Lock everything
    card.querySelectorAll('input').forEach(inp => {
      inp.disabled = true;
      if (!inp.classList.contains('ok')) { inp.style.borderColor='#6BCB77'; inp.style.background='#e8fef0'; }
    });
    const tsvg = card.querySelector('.thermo-svg');
    if (tsvg) tsvg.style.pointerEvents='none';
    launchConfetti(day.color);
  } else {
    card.classList.add('wrong');
    fb.textContent = rand(WRONG);
    fb.classList.add('show','bad-fb');
    checkBtn.style.display = 'none';
    tryBtn.style.display   = 'inline-block';
    card.querySelectorAll('input[type=number],input[type=text]').forEach(inp => {
      inp.classList.remove('shake');
      void inp.offsetWidth;
      inp.classList.add('shake');
    });
  }
  updateProgress(day);
  checkAllDone(day);
}

// ===================== TRY AGAIN =====================
function tryAgain(i) {
  const card = document.getElementById('qcard-'+i);
  const fb   = document.getElementById('fb-'+i);
  card.classList.remove('correct','wrong');
  fb.classList.remove('show','ok-fb','bad-fb');
  document.getElementById('checkBtn-'+i).style.display='inline-block';
  document.getElementById('tryBtn-'+i).style.display='none';
  card.querySelectorAll('input').forEach(inp => {
    inp.disabled=false; inp.value='';
    inp.style.borderColor=''; inp.style.background='';
    inp.classList.remove('shake','ok','bad');
  });
  // Reset thermometer
  const mercury = card.querySelector('[id^="mercury-"]');
  if (mercury) { mercury.setAttribute('y','278'); mercury.setAttribute('height','0'); }
  const marker = card.querySelector('[id^="tmarker-"]');
  if (marker) marker.setAttribute('display','none');
  const tread = card.querySelector('[id^="tread-"]');
  if (tread) { tread.textContent='—'; tread.style.visibility='hidden'; }
  const tsvg = card.querySelector('.thermo-svg');
  if (tsvg) tsvg.style.pointerEvents='';
  // Reset even-number buttons
  card.querySelectorAll('.num-btn').forEach(btn => {
    btn.classList.remove('selected','locked','wrong-sel','missed');
  });
  // Reset fact-family input colours
  card.querySelectorAll('.fact-input').forEach(inp => {
    inp.classList.remove('ok','bad');
  });
  // Reset fraction sections
  card.querySelectorAll('.frac-section').forEach(el => {
    el.classList.remove('shaded','locked','correct-shade','wrong-shade');
    el.style.fill = '';
  });
  const first = card.querySelector('input[type=number],input[type=text]');
  if (first) first.focus();
}

// ===================== HINT =====================
function toggleHint(i) {
  const box = document.getElementById('hint-'+i);
  const btn = document.getElementById('hintBtn-'+i);
  box.classList.toggle('show');
  btn.textContent = box.classList.contains('show') ? '💬 Hide hint' : '💬 Show hint';
}

// ===================== DONE CHECK =====================
const DAY_TITLES = ["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"];
const WELL_DONES = ["Brilliant work! ⭐","Amazing effort! 🌟","Superb! You nailed it! 🎉","Fantastic job! 🎊","Outstanding! ✨","You're on fire! 🔥","Incredible! 💫"];

function checkAllDone(day) {
  if (!day.questions.every((_,i) => scores[i]===true)) return;
  completedDays.add(currentDay);

  const unlockedDays = DAYS.filter(d => !d.locked).length;
  const remaining = unlockedDays - completedDays.size;
  const allDone = remaining === 0;

  // Banner emoji and title
  const dayEmoji = day.emoji;
  document.getElementById('doneBannerEmoji').textContent = allDone ? '🏆' : dayEmoji;
  document.getElementById('doneBannerTitle').textContent = allDone
    ? 'ALL DAYS COMPLETE! 🏆'
    : `Day ${day.day} Complete!`;

  // Summary message based on remaining days
  let summary;
  if (allDone) {
    summary = rand(["WOW! You've finished ALL the days! You're a maths champion! 🎉🎊","INCREDIBLE! Every day done — you're a maths superstar! 🌟🌟🌟","AMAZING! Holiday Maths Champion! Well done! 🏅🎉🚀"]);
  } else if (remaining === 1) {
    summary = rand(["Great work! Just 1 day left — you can do it! 💪","Brilliant! Only 1 more day to go! 🌟","Almost there — 1 day left! 🚀"]);
  } else {
    summary = `${rand(WELL_DONES)} ${remaining} day${remaining>1?'s':''} left to complete.`;
  }
  document.getElementById('doneSummary').textContent = summary;
  document.getElementById('doneStars').textContent = '⭐'.repeat(5);

  const banner = document.getElementById('doneBanner');
  banner.style.background = allDone
    ? 'linear-gradient(135deg,#FF6B6B,#FFB347,#FFD93D,#6BCB77,#4D96FF,#C77DFF)'
    : day.gradient;
  banner.classList.add('show');
  banner.scrollIntoView({behavior:'smooth',block:'nearest'});

  launchConfetti(day.color);
  setTimeout(()=>launchConfetti('#FFD93D'),300);
  setTimeout(()=>launchConfetti('#6BCB77'),600);
  if (allDone) {
    setTimeout(()=>launchConfetti('#FF6B6B'),900);
    setTimeout(()=>launchConfetti('#C77DFF'),1200);
  }
}

// ===================== CONFETTI =====================
function launchConfetti(base) {
  const wrap = document.getElementById('confetti');
  wrap.classList.add('active');
  const cols=[base,'#FFD93D','#FF6B6B','#6BCB77','#C77DFF','#4D96FF'];
  for(let k=0;k<30;k++){
    const d=document.createElement('div');
    d.className='confetti-dot';
    d.style.left=Math.random()*100+'vw';
    d.style.top='-20px';
    d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.width=(8+Math.random()*8)+'px';
    d.style.height=(8+Math.random()*8)+'px';
    d.style.animationDuration=(0.8+Math.random()*0.8)+'s';
    d.style.animationDelay=(Math.random()*0.4)+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'3px';
    wrap.appendChild(d);
  }
  setTimeout(()=>{ wrap.innerHTML=''; wrap.classList.remove('active'); },1600);
}

buildHome();
